name: Deploy Supabase Gemini Functions

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Deploy legal-assistant
        run: supabase functions deploy legal-assistant --project-ref "$SUPABASE_PROJECT_REF"

      - name: Deploy analyze-case
        run: supabase functions deploy analyze-case --project-ref "$SUPABASE_PROJECT_REF"
